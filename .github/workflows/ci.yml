name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/uma-sim-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/uma-sim-ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: uma-sim-ui-dist
          path: packages/uma-sim-ui/dist

  rust:
    runs-on: ubuntu-latest
    needs: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: uma-sim-ui-dist
          path: packages/uma-sim-ui/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo build --release --features embed-ui -p uma-sim-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/calibrate_grand_live.py --strict
