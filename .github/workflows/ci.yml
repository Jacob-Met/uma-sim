name: ci
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - 'NOTICE'
      - 'docs/**'
  pull_request:

# uma-sim #4 M2: explicit minimal GITHUB_TOKEN permissions (defense-in-depth;
# this workflow consumes no secrets.*). release.yml's `contents: write` +
# secrets.GITHUB_TOKEN use is deliberately out of scope (lane-3 judged it
# intentional for gh-release).
permissions:
  contents: read

# uma-sim #3 P2: cancel stale runs on re-push / re-run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # uma-sim #3 P3: typical run ~2-3 min; fail fast on hangs
    defaults:
      run:
        working-directory: packages/uma-sim-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/uma-sim-ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uma-sim-ui-dist
          path: packages/uma-sim-ui/dist

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # uma-sim #3 P3: typical run ~3 min (p50 2.7, max 3.3)
    needs: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uma-sim-ui-dist
          path: packages/uma-sim-ui/dist
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      # uma-sim #3 P1: warm the cargo cache so every run no longer rebuilds
      # the full workspace from scratch (release build is the expensive step).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - run: cargo build --locked --release --features embed-ui -p uma-sim-core
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Exercise the career laboratory through MCP and the native API
        env:
          UMA_SIM_TEST_API_BIN: ${{ github.workspace }}/target/release/uma-sim-api
          UMA_SIM_TEST_OUTPUT_DIR: ${{ runner.temp }}/uma-sim-mcp-native
          UMA_SIM_TEST_RECEIVING_COMMIT: ${{ github.sha }}
        run: node --test packages/uma-sim-mcp/tests/*native.test.mjs
      - name: Retain MCP native comparison and receiving evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uma-sim-mcp-native
          path: ${{ runner.temp }}/uma-sim-mcp-native
      - name: Smoke-test release layout (binary run away from the source tree)
        run: |
          STAGE=dist/uma-sim-linux-x64
          mkdir -p "$STAGE/knowledge/canonical/by_kind"
          cp target/release/uma-sim "$STAGE/"
          cp -r research content_packs "$STAGE/"
          cp knowledge/canonical/by_kind/*.json "$STAGE/knowledge/canonical/by_kind/"
          scripts/smoke_release_layout.sh "$STAGE" uma-sim
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/calibrate_grand_live.py --strict

  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      # Dependency-free protocol and HTTP contract tests. Native API receiving
      # runs separately against the release binary in the Rust job above.
      - run: node --test packages/uma-sim-mcp/tests/*.test.mjs
