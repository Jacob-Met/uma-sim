name: ci
on:
  push:
    branches: [main]
  pull_request:

# One run per ref: a new push to a PR branch cancels its stale run. Pushes to
# main are not cancelled, so every main commit keeps a complete result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/uma-sim-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/uma-sim-ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: uma-sim-ui-dist
          path: packages/uma-sim-ui/dist

  rust:
    runs-on: ubuntu-latest
    needs: ui
    # Typical warm run is ~3 min; a cold cache rebuilds the workspace twice
    # (debug + release), so leave headroom without the 360 min default.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: uma-sim-ui-dist
          path: packages/uma-sim-ui/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Caches ~/.cargo registry/git and target/, keyed on toolchain + Cargo.lock.
      # Only main saves the cache, so PR runs restore it without evicting it.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo build --release --features embed-ui -p uma-sim-core
      - name: Smoke-test release layout (binary run away from the source tree)
        run: |
          STAGE=dist/uma-sim-linux-x64
          mkdir -p "$STAGE/knowledge/canonical/by_kind"
          cp target/release/uma-sim "$STAGE/"
          cp -r research content_packs "$STAGE/"
          cp knowledge/canonical/by_kind/*.json "$STAGE/knowledge/canonical/by_kind/"
          scripts/smoke_release_layout.sh "$STAGE" uma-sim
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/calibrate_grand_live.py --strict
