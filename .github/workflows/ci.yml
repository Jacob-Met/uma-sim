name: ci
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - 'NOTICE'
      - 'docs/**'
  pull_request:
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/uma-sim-ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/uma-sim-ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uma-sim-ui-dist
          path: packages/uma-sim-ui/dist

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: uma-sim-ui-dist
          path: packages/uma-sim-ui/dist
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo build --release --features embed-ui -p uma-sim-core
      - name: Smoke-test release layout (binary run away from the source tree)
        run: |
          STAGE=dist/uma-sim-linux-x64
          mkdir -p "$STAGE/knowledge/canonical/by_kind"
          cp target/release/uma-sim "$STAGE/"
          cp -r research content_packs "$STAGE/"
          cp knowledge/canonical/by_kind/*.json "$STAGE/knowledge/canonical/by_kind/"
          scripts/smoke_release_layout.sh "$STAGE" uma-sim
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python scripts/calibrate_grand_live.py --strict
