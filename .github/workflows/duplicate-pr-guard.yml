# Use pull_request_target so labels/comments also work for fork PRs. The job checks
# out only the base branch and never executes pull-request-controlled code.
name: duplicate-pr-guard

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  flag-duplicate-candidates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Label and comment on duplicate candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/duplicate-pr-guard.mjs
