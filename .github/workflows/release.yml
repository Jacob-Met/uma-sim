name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/release.yml", "scripts/smoke_release_layout.sh"]

permissions:
  contents: write

jobs:
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/uma-sim-ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/uma-sim-ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uma-sim-ui-dist
          path: packages/uma-sim-ui/dist

  build:
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: uma-sim-windows-x64
            bin: uma-sim.exe
          - os: ubuntu-latest
            artifact: uma-sim-linux-x64
            bin: uma-sim
            # Built and smoke-tested inside AlmaLinux 8 (glibc 2.28) so the
            # binary runs on Ubuntu 20.04+, Debian 10+, RHEL/Alma/Rocky 8+.
            container: quay.io/pypa/manylinux_2_28_x86_64
          - os: macos-latest
            artifact: uma-sim-macos-arm64
            bin: uma-sim
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: uma-sim-ui-dist
          path: packages/uma-sim-ui/dist
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        if: matrix.container == ''
      - name: Build release binary (embedded UI)
        if: matrix.container == ''
        run: cargo build --release --features embed-ui -p uma-sim-core
      - name: Build release binary in old-glibc container
        if: matrix.container != ''
        run: |
          docker run --rm -v "$PWD:/w" -w /w ${{ matrix.container }} bash -euxc '
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            . "$HOME/.cargo/env"
            ldd --version | head -1
            cargo build --release --features embed-ui -p uma-sim-core
          '
          sudo chown -R "$(id -u):$(id -g)" target
      - name: Stage package
        shell: bash
        run: |
          set -euo pipefail
          STAGE="dist/${{ matrix.artifact }}"
          mkdir -p "$STAGE"
          BIN="target/release/${{ matrix.bin }}"
          cp "$BIN" "$STAGE/"
          cp -r research "$STAGE/research"
          mkdir -p "$STAGE/knowledge/canonical/by_kind"
          cp knowledge/canonical/by_kind/*.json "$STAGE/knowledge/canonical/by_kind/"
          cp -r content_packs "$STAGE/content_packs"
          cp LICENSE NOTICE README.md "$STAGE/"
      - name: Check binary platform
        shell: bash
        run: |
          set -euo pipefail
          BIN="dist/${{ matrix.artifact }}/${{ matrix.bin }}"
          case "${{ matrix.artifact }}" in
            uma-sim-linux-x64)
              file "$BIN"
              # Highest glibc symbol version the binary needs must be <= 2.28.
              MAX=$(objdump -T "$BIN" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
              echo "max GLIBC symbol version: $MAX"
              [ "$(printf '%s\n2.28\n' "$MAX" | sort -V | tail -1)" = "2.28" ] || { echo "glibc floor exceeded"; exit 1; }
              ;;
            uma-sim-macos-arm64)
              file "$BIN"
              lipo -archs "$BIN" | tee /dev/stderr | grep -qx arm64
              uname -m
              ;;
            *) file "$BIN" || true ;;
          esac
      - name: Zip package
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if command -v zip >/dev/null 2>&1; then
            zip -r "${{ matrix.artifact }}.zip" "${{ matrix.artifact }}"
          else
            7z a -tzip "${{ matrix.artifact }}.zip" "${{ matrix.artifact }}"
          fi
      - name: Verify the zip itself (unzip fresh, smoke-test layout)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf verify && mkdir verify
          if command -v unzip >/dev/null 2>&1; then
            unzip -q "dist/${{ matrix.artifact }}.zip" -d verify
          else
            7z x -y -overify "dist/${{ matrix.artifact }}.zip" >/dev/null
          fi
          chmod +x "verify/${{ matrix.artifact }}/${{ matrix.bin }}" || true
          if [ -n "${{ matrix.container }}" ]; then
            # run the smoke test inside the old-glibc image too
            docker run --rm -v "$PWD:/w" -w /w ${{ matrix.container }} \
              scripts/smoke_release_layout.sh "verify/${{ matrix.artifact }}" "${{ matrix.bin }}"
          else
            scripts/smoke_release_layout.sh "verify/${{ matrix.artifact }}" "${{ matrix.bin }}"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip

  release:
    # Publishes only on a tag, and only when all three platform builds passed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: uma-sim-{windows-x64,linux-x64,macos-arm64}
          path: dist
          merge-multiple: true
      - run: |
          ls -l dist
          test "$(ls dist/*.zip | wc -l)" = 3
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
