[package]
name = "uma-sim-core"
version = "0.1.0"
edition = "2021"

description = "Umamusume career simulator engine"
license = "GPL-3.0"
repository = "https://github.com/Jacob-Met/uma-sim"

[features]
default = []
embed-ui = ["dep:rust-embed"]

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
uma-race-core = { path = "../uma-race-core" }
rust-embed = { version = "8", optional = true, features = ["mime-guess"] }

[[bin]]
name = "uma-sim"
path = "src/bin/uma-sim.rs"

[[bin]]
name = "uma-sim-api"
path = "src/bin/uma-sim-api.rs"

[[example]]
name = "trace_check"
path = "examples/trace_check.rs"

[[example]]
name = "summaries_check"
path = "examples/summaries_check.rs"

[[example]]
name = "golden_batch"
path = "examples/golden_batch.rs"


[[example]]
name = "tb_shop_dump"
path = "examples/tb_shop_dump.rs"


[[example]]
name = "tb_diverge"
path = "examples/tb_diverge.rs"


[[example]]
name = "tb_turns"
path = "examples/tb_turns.rs"

